name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast feedback on every PR: the Zig suite, no C++ toolchain work.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sources and build files use spellings valid in all three, falling
        # back to `if (comptime @hasDecl(...))` where no shared spelling
        # exists: the std.Io filesystem move, ArrayList.writer, Compile's
        # add*/link* forwarders, std.json's unmanaged ObjectMap. Testing
        # every version keeps that honest rather than assumed.
        zig: ["0.14.1", "0.15.2", "0.16.0"]
    name: test (zig ${{ matrix.zig }})
    env:
      # Skip the C++ examples. Zig resolves every declared dependency while
      # the build graph is constructed, so leaving these on would fetch JUCE,
      # curl, mbedtls, zlib, spdlog and fmt just to run Zig tests.
      ZAZA_EXAMPLES: none
      # Isolate the local build cache per lane so a 0.14 build and a 0.16 build
      # never share a stale cache (zaza#44).
      ZIG_LOCAL_CACHE_DIR: .zig-cache-${{ matrix.zig }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Test
        run: zig build test --summary all

      # zaza-import (zaza#43) also uses the compat adaptor and a comptime entry
      # point; compile it on every lane to catch version-specific breaks.
      - name: Build zaza-import
        run: zig build zaza-import --summary all

      # zaza-lipo uses the version-compat adaptor, and `zig build test` does not
      # build it. Compile it on each Zig version so a version-specific break in
      # the tool's entry point is caught here.
      - name: Build zaza-lipo
        run: zig build zaza-lipo --summary all

      # Same reasoning for zaza-drive: it drives the compat adaptor's filesystem
      # and process-spawn paths and has a comptime-dispatched entry point. The
      # full-build job compiles it, but only on one Zig version. Build it here on
      # each lane. ZAZA_EXAMPLES=none keeps it from fetching the C++ deps.
      - name: Build zaza-drive
        run: zig build drive --summary all

      # Build and run the dependency CLI as an executable. `zig build test` only
      # analyses the CLI functions the tests reference, so it would miss a
      # version-specific break in the entry point or the cache/env path. Running
      # it compiles the whole program on each Zig version and exercises the
      # read-only commands.
      - name: Smoke-test the zaza CLI
        run: |
          zig run scripts/zaza.zig -- list
          zig run scripts/zaza.zig -- deps
          zig run scripts/zaza.zig -- cache

      # Assert the committed zaza.lock still mirrors build.zig.zon. This fails the
      # build if a dependency's pin was changed without regenerating the lock,
      # so a reproducible tree is enforced on every lane (zaza#45).
      - name: Verify the dependency lock is in sync
        run: zig run scripts/zaza.zig -- lock --check

  # Cross-version example coverage. `zig build test` never builds the examples,
  # and the macOS full-build runs a single Zig version, so a version-specific
  # break in an example (a std.fs.cwd in a build.zig, say) had no lane to catch
  # it. example-matrix builds and runs the verified example surface. The matrix
  # examples are all self-contained, so ZAZA_EXAMPLES scopes the graph to them
  # and a fresh runner fetches nothing (no cmake, cargo, or JUCE). If a matrix
  # target's example is missing from this list its nested step fails loudly, so
  # the list stays honest.
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.14.1", "0.15.2", "0.16.0"]
    name: examples (zig ${{ matrix.zig }})
    env:
      ZAZA_REGISTRY: "0"
      ZAZA_EXAMPLES: "hello-zaza,proof-library,target-kinds,generated-code,package-consumer,package-producer,mixed-stack,interface-object-graph,zaza-subproject,orchestration,unity-build,test-workflows,bench-suite,generated-headers,shared-plugin,preset-profiles,cross-compile-cli,resources-bundle,bindings,benchmark-workflow,cxx20-modules,wasm-wasi,wasm-exports,universal-binary"
      # cxx20-modules needs a C++20-modules-capable clang++. Ubuntu ships one;
      # point the example at it so the matrix covers it off macOS too.
      ZAZA_MODULES_CXX: "/usr/bin/clang++"
      # Per-lane local cache so the three lanes never share a stale cache (zaza#44).
      ZIG_LOCAL_CACHE_DIR: .zig-cache-${{ matrix.zig }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      # The cxx20-modules example precompiles a C++20 module with clang. Ensure a
      # recent clang is present (ubuntu images ship one, this pins it).
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      # example-matrix shells out to ./zig for each nested step. That wrapper is
      # machine-local and gitignored, so it is absent on a fresh checkout.
      # Generate a minimal one that execs the Zig this job installed.
      - name: Run the example matrix
        run: |
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$(command -v zig)" > ./zig
          chmod +x ./zig
          ./zig build example-matrix --summary all

  # CMake-ecosystem interop, both directions. These examples resolve and drive
  # real installed tooling (pkg-config, cmake, zlib), so they are kept off the
  # example matrix and verified here where those tools are guaranteed. Native
  # toolchains on the runner, so the Zig-built and CMake-built objects share an
  # architecture with no override.
  cmake-interop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.14.1", "0.15.2", "0.16.0"]
    name: cmake-interop (zig ${{ matrix.zig }})
    env:
      ZIG_LOCAL_CACHE_DIR: .zig-cache-${{ matrix.zig }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Install cmake, pkg-config, zlib
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config zlib1g-dev

      # Consume: link an installed zlib resolved by pkg-config and by CMake's
      # own find_package, with no hand-wired paths.
      - name: findPackage (consume installed packages)
        run: ZAZA_EXAMPLES=find-package zig build find-package --summary all

      # Be consumed: a plain CMake project finds a Zaza-built library with
      # find_package and links its imported target.
      - name: CMake package export (be consumed by CMake)
        run: sh examples/cmake_consumer/verify.sh

      # add_subdirectory: Zaza builds an in-tree CMake subtree and links it.
      - name: addCMakeSubdirectory (build a CMake subtree)
        run: ZAZA_EXAMPLES=cmake-subdir zig build cmake-subdir-run --summary all

  # The external corpus: real upstream projects rebuilt through Zaza (see
  # corpus/). Each slice is a standalone package outside the root build, so
  # neither `zig build test` nor the example matrix touches it — this is the only
  # lane that builds and runs the slices. Pinned to Zig 0.16.0 because libxev and
  # libvaxis require it; the C/C++ slices build on it too. Each slice's fetch.sh
  # checks its pinned upstream out over the network, which is why this fetches
  # from several external repos rather than nothing like the example matrix.
  corpus:
    runs-on: ubuntu-latest
    name: corpus (zig 0.16.0)
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          # libxev and libvaxis set minimum_zig_version 0.16.0; the other slices
          # were verified on it too.
          version: 0.16.0

      # imgui_glfw links system GLFW and OpenGL and renders headless under a
      # virtual framebuffer with Mesa's software GL. The other slices need none
      # of this.
      - name: Install imgui_glfw system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglfw3-dev libgl1-mesa-dev libgl1-mesa-dri xvfb

      - name: fmt slice
        working-directory: corpus/fmt
        run: ./fetch.sh && zig build run --summary all

      - name: imgui slice
        working-directory: corpus/imgui
        run: ./fetch.sh && zig build run --summary all

      # Software GL under Xvfb: no GPU on the runner.
      - name: imgui_glfw slice (headless GL)
        working-directory: corpus/imgui_glfw
        run: ./fetch.sh && LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a zig build run --summary all

      # fetch.sh builds libxev's C static library (its own zig build) before the
      # Zaza consumer links it.
      - name: libxev slice
        working-directory: corpus/libxev
        run: ./fetch.sh && zig build run --summary all

      # fetch.sh seeds the package cache with libvaxis and its deps; on a
      # networked runner `zig build` could fetch them itself, but seeding keeps
      # this identical to the documented offline path.
      - name: libvaxis slice
        working-directory: corpus/libvaxis
        run: ./fetch.sh && zig build run --summary all

  # The whole graph, C++ examples and JUCE included. Slow (JUCE is compiled
  # from source), so it is kept off the PR path.
  full-build:
    if: github.event_name != 'pull_request'
    # Pinned to macos-15. macos-latest ships Xcode 26.5, whose SDK Zig cannot
    # link against: every libc symbol comes out undefined and even the build
    # runner fails to link. Setting SDKROOT does not help, since the SDK
    # itself is the problem rather than its discoverability.
    runs-on: macos-15
    env:
      ZAZA_SYSTEM_CMDS: 1
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          # Single version deliberately: this job compiles JUCE and the C++
          # examples, so running it twice would double an already slow job.
          version: 0.15.2

      # Reported so the next SDK break is obvious from the log rather than
      # showing up as a wall of undefined symbols.
      - name: Report toolchain
        run: |
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-path)"

      - name: Build everything
        run: zig build --summary all

      # Build zaza-drive so its use of the version-compat adaptor (filesystem
      # and process spawning) is compiled on every supported Zig version. The
      # default build does not install the driver, so it needs its own line.
      - name: Build zaza-drive
        run: zig build drive --summary all

      # Exercise the first-class test and benchmark API end to end: the run
      # steps, not just the build. test-workflows also runs transitively through
      # the top `test` step, but naming it here keeps the coverage explicit, and
      # the benchmark is off `test` by design so it needs its own line.
      - name: Exercise the test and benchmark API
        run: zig build test-workflows-run bench-suite-run -- --reps 3

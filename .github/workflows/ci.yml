name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast feedback on every PR: the Zig suite, no C++ toolchain work.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sources and build files use spellings valid in both: root_module,
        # ArrayListUnmanaged, and shims for the std.Io and std.json reworks.
        # Testing both keeps that honest rather than assumed.
        zig: ["0.14.1", "0.15.2"]
    name: test (zig ${{ matrix.zig }})
    env:
      # Skip the C++ examples. Zig resolves every declared dependency while
      # the build graph is constructed, so leaving these on would fetch JUCE,
      # curl, mbedtls, zlib, spdlog and fmt just to run Zig tests.
      ZAZA_EXAMPLES: none
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Test
        run: zig build test --summary all

  # The whole graph, C++ examples and JUCE included. Slow (JUCE is compiled
  # from source), so it is kept off the PR path.
  full-build:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    env:
      ZAZA_SYSTEM_CMDS: 1
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      # Zig cannot find libSystem on the macOS runners by itself; without this
      # even the build runner fails to link, every libc symbol undefined.
      - name: Point Zig at the macOS SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Build everything
        run: zig build --summary all
